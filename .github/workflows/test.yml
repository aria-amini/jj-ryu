name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# A workflow_call caller (release.yml) otherwise passes down its write token.
permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  MISE_ENV: ci

jobs:
  test:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lint: true
          - os: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install mise tools
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.10

      - name: Lint
        if: matrix.lint
        run: mise run lint

      - name: Run tests
        run: mise run test

