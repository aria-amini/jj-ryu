name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# A workflow_call caller (release.yml) otherwise passes down its write token.
permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lint: true
          - os: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: matrix.lint
        run: cargo fmt --all -- --check

      - name: Run Clippy
        if: matrix.lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Verify release archives
        if: matrix.lint
        run: scripts/test-release-archives.sh

      - name: Install jj
        run: cargo install --locked jj-cli --version 0.46.0

      - name: Run tests
        run: cargo test

  # E2E tests run only on main branch with secrets
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install jj
        run: cargo install --locked jj-cli

      - name: Run E2E tests
        env:
          JJ_RYU_E2E_TESTS: "1"
          JJ_RYU_TEST_GITHUB_TOKEN: ${{ secrets.TEST_GITHUB_TOKEN }}
          JJ_RYU_TEST_REPO: ${{ secrets.TEST_REPO }}
        run: cargo test --test e2e_tests -- --ignored
        continue-on-error: true # E2E tests may fail if secrets not configured
